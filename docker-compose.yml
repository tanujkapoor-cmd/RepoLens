services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repolens-postgres
    environment:
      POSTGRES_DB: repolens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - repolens_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  repolens_pg_data:
